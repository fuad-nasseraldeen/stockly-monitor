name: Stockly Monitoring

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Stockly monitoring checks
        env:
          STOCKLY_API_URL: ${{ secrets.STOCKLY_API_URL }}
          MONITORING_INGEST_SECRET: ${{ secrets.MONITORING_INGEST_SECRET }}
          STOCKLY_TEST_ADMIN_EMAIL: ${{ secrets.STOCKLY_TEST_ADMIN_EMAIL }}
          STOCKLY_TEST_ADMIN_PASSWORD: ${{ secrets.STOCKLY_TEST_ADMIN_PASSWORD }}
          STOCKLY_TEST_ADMIN_TOKEN: ${{ secrets.STOCKLY_TEST_ADMIN_TOKEN }}
        run: npm run check